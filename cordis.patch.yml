# The dsh-ai-coding bundle patch: the merged single-package mount rows, applied
# after every earlier layer (dsh-base, then dsh-web-app) when this package is
# listed in the profile's `dsh.profile.bundles` via `dsh plugin --profile web add`.
#
# Shape: a patch file is a top-level YAML ARRAY of loader patch entries. The
# previous `plugins: overrides:` object here was the pre-merge draft's shape and
# is rejected by the 0.1.5 loader.
#
# A patch replaces the targeted row's whole `config`, so any later layer that
# wants different values restates every key it owns. Row order carries no load
# semantics (activation is service-availability driven).
#
# `!!js` is the only expression dialect the config schema allows, and
# `dshHomePath` is provided by the boot context for exactly this purpose.
#
# Both rows ALSO publish their deployment values into the served page, through the
# webserver structured injection table, which is how the browser half learns its
# endpoints without an operator typing them. What crosses: the endpoints always; the
# platform accessToken when set, because that key means a static token for a no-login
# deployment; the workspace accessToken only with authMode static-token. An account
# deployment therefore hands the page no secret. Pages are served behind the
# browser-session index authorization, so only an authenticated page receives them.
#
# Both rows are host-only deployment wiring: the 0.1.5-rc.2 client runner delivers no
# row configuration to browser fragments (docs/api-drift-ledger.md D23), which is why
# the rows publish their slice themselves instead of relying on the loader. The
# workbench settings face remains the config channel for a deployment that declared
# nothing, and never overrides one that did (see README).
#
# Deployment-tunable keys these rows accept WITHOUT being set here (defaults live
# in each row's Schemastery schema, so the loader fills them and a deployment only
# states what it changes). A later layer that overrides one of these rows must
# restate every key it needs, because a patch replaces the row's whole `config`:
#
#   dsh-ai-coding:            telemetry.maxEvents | maxBytes | batchMaxEvents |
#                             batchMaxBytes | flushIntervalMs | httpTimeoutMs |
#                             maxAttempts | retentionMs | claimTimeoutMs
#                             discovery.confirmTimeoutMs (5000) |
#                             discovery.confirmIntervalMs (100)
#                             hostBridgeMaxBodyBytes (1048576)
#                             recallGate.model (jev-1.13.0) |
#                             recallGate.concurrency (4) |
#                             recallGate.thresholds.injectionMax (0.7) |
#                             recallGate.thresholds.contradictsMin (0.7) |
#                             recallGate.thresholds.relevantMin (0.38) |
#                             recallGate.thresholds.evidenceMin (0.48) |
#                             recallGate.endpoint | recallGate.requestTimeoutMs
#                               (these two carry no value here because their
#                                defaults live in the gate, not in the schema)
#   dsh-ai-coding/workspace:  previewOrigins ([])
#                             eventBufferLimit (256)
#                             pageWalkLimit (1000)
#
# The two `discovery` bounds are the ones a deployment is most likely to need:
# confirming a write is a handshake with an asynchronously updated on-disk Skill
# catalog, so a network Skill root or a busy host wants a longer window than the
# local default.
#
# `recallGate` labels each recall hit before it reaches the model. Its four
# thresholds are measured values with their evidence in
# `docs/typesafe-recall-gate.md`; re-tune them on real recall data, not by feel.
# The gate reads its key from the `TYPESAFE_API_KEY` credential reference (host
# credentials, never process env) and is mounted even without one: it then
# reports `no-credential` per recall and the knowledge loop injects unjudged,
# exactly as it did before the gate existed.

- insert:
    # Host Team Skill gateway AND the single browser roster entry. This row
    # must keep the BARE package name: the browser roster only reads
    # `dsh.client` from rows whose name is an exact package specifier, and the
    # client bundle is discovered from this package's `exports["./client"]`.
    - id: ai-coding-platform
      name: 'dsh-ai-coding'
      config:
        apiBaseUrl: !!js process.env.DSH_AI_CODING_PLATFORM_API_URL
        accessToken: !!js process.env.DSH_AI_CODING_PLATFORM_ACCESS_TOKEN
        stateDirectory: !!js dshHomePath('ai-coding-platform')
        globalSkillRoot: !!js dshHomePath('skills')

    # The cloud workspace Remote face of the same package: a separate host-only
    # row because the workbench calls a different service namespace
    # (`cloudWorkspaces`) and a deployment may host it at a different endpoint.
    # `authMode` defaults to `account`. Set DSH_CLOUD_WORKSPACE_ACCESS_TOKEN
    # together with authMode 'static-token' for a no-login deployment.
    # Subpath rows never contribute a client bundle, and the package may not be
    # named by a second bare-name row (that is a duplicate client source and an
    # aborted boot).
    - id: cloud-workspaces
      name: 'dsh-ai-coding/workspace'
      config:
        apiBaseUrl: !!js process.env.DSH_CLOUD_WORKSPACE_API_URL ?? process.env.DSH_AI_CODING_PLATFORM_API_URL
        accessToken: !!js process.env.DSH_CLOUD_WORKSPACE_ACCESS_TOKEN
        authMode: !!js process.env.DSH_CLOUD_WORKSPACE_AUTH_MODE
